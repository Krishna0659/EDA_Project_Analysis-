name: Analysis checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install tested runtime and project tools
        run: python -m pip install -r requirements.txt -e '.[dev]'
      - name: Test cleaning, customer isolation and complete analysis
        run: python -m pytest -q
      - name: Reproduce the full demonstration
        run: python -m credit_analysis.pipeline --output reports/validation
      - name: Execute portfolio notebook
        run: python scripts/execute_notebook.py --output reports/validation/credit_profile_analysis.ipynb
      - uses: actions/upload-artifact@v4
        with:
          name: verified-synthetic-analysis
          path: reports/validation
